name: Verify algorithm

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt Pillow
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Reproduce examples and verify the codec
        run: python run_examples.py
      - name: Rebuild README gallery and verify its scored layouts
        run: python docs/generate_gallery.py
